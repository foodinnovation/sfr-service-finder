name: Check and publish

# Every change saved on main is checked and, if the check passes, published to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the browser for the check
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium

      - name: Check texts, icons and the page in DE, FR and EN
        run: python tests/check.py

      - name: Keep the screenshots for checking
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: check-*.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Collect the site
        run: |
          mkdir site
          cp -r index.html preview.html assets content site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
